[package]
name = "teslamate-rust"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
panic = "deny"
expect_used = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
# Tokio is the async runtime of this crate. Every I/O dependency added later
# (database, HTTP, MQTT, ...) has to run on it; do not mix in crates built
# for another runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
