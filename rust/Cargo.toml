[package]
name = "teslamate-rust"
# No version here: the version is defined once, in the repository's VERSION
# file, and build.rs derives it from there. Cargo itself uses 0.0.0.
edition = "2024"
description = "A self-hosted data logger for your Tesla"
license = "AGPL-3.0-or-later"
publish = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
panic = "deny"
expect_used = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
# Tokio is the async runtime of this crate. Every I/O dependency added later
# (database, HTTP, MQTT, ...) has to run on it; do not mix in crates built
# for another runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

clap = { version = "4.6.7", features = ["derive", "env"] }
thiserror = "2"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.3.14", features = ["postgres", "chrono", "serde_json", "numeric", "64-column-tables"] }
diesel-async = { version = "0.9.0", features = ["async-connection-wrapper", "bb8", "postgres"] }
diesel_migrations = { version = "2.2.0", features = ["postgres"] }
bb8 = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.34"
opentelemetry = { version = "0.33", features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-semantic-conventions = "0.33"
# Exports over gRPC only; the default features would add the HTTP exporter
# and its reqwest client.
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "logs", "metrics", "internal-logs", "grpc-tonic", "tls-ring", "tls-webpki-roots"] }
opentelemetry-appender-tracing = "0.33"
diesel-cte-ext = { version = "0.3.0", default-features = false, features = ["postgres", "async"] }
# Rust type Diesel maps `Numeric` columns to (through the `numeric` feature).
bigdecimal = "0.4"
