[package]
name = "teslamate-rust"
# No version here: the version is defined once, in the repository's VERSION
# file, and build.rs derives it from there. Cargo itself uses 0.0.0.
edition = "2024"
description = "A self-hosted data logger for your Tesla"
license = "AGPL-3.0-or-later"
publish = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
panic = "deny"
expect_used = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
# Tokio is the async runtime of this crate. Every I/O dependency added later
# (database, HTTP, MQTT, ...) has to run on it; do not mix in crates built
# for another runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

clap = { version = "4.6.7", features = ["derive", "env"] }
data-encoding = "2.5.0"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tap = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-core = "0.1"
tracing-opentelemetry = "0.34"
opentelemetry = { version = "0.33", features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-semantic-conventions = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["logs", "metrics", "tls-ring", "tls-webpki-roots", "grpc-tonic"] }
opentelemetry-appender-tracing = "0.33"
tonic = "0.14"
log = "0.4"
