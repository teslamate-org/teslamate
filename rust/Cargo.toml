[package]
name = "teslamate-rust"
# No version here: the version is defined once, in the repository's VERSION
# file, and build.rs derives it from there. Cargo itself uses 0.0.0.
edition = "2024"
description = "A self-hosted data logger for your Tesla"
license = "AGPL-3.0-or-later"
publish = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
panic = "deny"
expect_used = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
# Tokio is the async runtime of this crate. Every I/O dependency added later
# (database, HTTP, MQTT, ...) has to run on it; do not mix in crates built
# for another runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# PostgreSQL only, so no SQLite or MySQL driver is built. No TLS backend
# while DATABASE_SSL is not ported; then rustls with ring, like
# opentelemetry-otlp below.
# `bigdecimal` rather than `rust_decimal` for NUMERIC: it decodes any NUMERIC
# value losslessly, whereas rust_decimal stops at 28 significant digits and
# unconstrained NUMERIC results (e.g. a division) can carry more. The chrono
# and bigdecimal types are used through sqlx's re-exports (`sqlx::types`), so
# their versions always match sqlx's.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "bigdecimal"] }

clap = { version = "4.6.7", features = ["derive", "env"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.34"
opentelemetry = { version = "0.33", features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-semantic-conventions = "0.33"
# Exports over gRPC only; the default features would add the HTTP exporter
# and its reqwest client.
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "logs", "metrics", "internal-logs", "grpc-tonic", "tls-ring", "tls-webpki-roots"] }
opentelemetry-appender-tracing = "0.33"

[dev-dependencies]
# Reads the Grafana dashboard JSON in tests/vampire_drain.rs.
serde_json = "1"
