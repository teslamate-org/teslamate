name: Check paths

on:
  workflow_call:
    # Map the workflow outputs to job outputs
    outputs:
      githubfolder:
        description: "changes to .github folder"
        value: ${{ jobs.check_paths.outputs.githubfolder }}
      elixir:
        description: "changes to Elixir code"
        value: ${{ jobs.check_paths.outputs.elixir }}
      rust:
        description: "changes to Rust code"
        value: ${{ jobs.check_paths.outputs.rust }}

permissions:
  contents: read

jobs:
  check_paths:
    runs-on: ubuntu-24.04
    outputs:
      githubfolder: ${{ steps.filter.outputs.githubfolder }}
      elixir: ${{ steps.filter.outputs.elixir }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          base: "main" # needed to set as a called workflow does not have direct access to repository.default_branch
          filters: |
            githubfolder:
              - '.github/**'
            elixir:
              - '**.ex'
              - '**.exs'
              - '**.heex'
              - '**.eex'
              - 'mix.lock'
              - 'priv/gettext/**'
              - '.formatter.exs'
              - '.credo.exs'
              - '.dialyzer_ignore.exs'
            rust:
              - 'teslamate-rust/**'
