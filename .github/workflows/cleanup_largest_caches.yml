name: Cleanup largest 100 caches

on:
  workflow_dispatch:

# A newer run on the same ref lists and deletes the largest caches again, so
# it supersedes the older one, which is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  cleanup:
    name: Delete largest 100 caches
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write # required to delete caches

    steps:
      - name: Cleanup largest 100 caches
        run: |
          echo "Fetching list of cache key"
          cacheKeysLargest=$(gh cache list --repo "$REPO" --limit 100 --sort size_in_bytes --order desc | cut -f 1 )

          ## Setting this to not fail the workflow while deleting cache keys.
          set +e
          echo "Deleting caches..."
          while IFS= read -r cacheKey; do
              [ -n "$cacheKey" ] || continue
              gh cache delete "$cacheKey" --repo "$REPO"
          done <<<"$cacheKeysLargest"
          echo "Done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
