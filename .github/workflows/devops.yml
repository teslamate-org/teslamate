name: DevOps

on:
  push:
    branches: ["main"]
    paths:
      - "**/*"
      - "!.github/**" # Important: Exclude PRs related to .github from auto-run
      - "!.github/workflows/**" # Important: Exclude PRs related to .github/workflows from auto-run
      - "!.github/actions/**" # Important: Exclude PRs related to .github/actions from auto-run
  pull_request:
    branches: ["main"]
    paths:
      - "**/*"
      - "!.github/**" # Important: Exclude PRs related to .github from auto-run
      - "!.github/workflows/**" # Important: Exclude PRs related to .github/workflows from auto-run
      - "!.github/actions/**" # Important: Exclude PRs related to .github/actions from auto-run
  # Pull requests touching .github are excluded from the automatic runs above,
  # since the workflow definition that would run is the one from the pull
  # request. This is the deliberate way to run the chain for them anyway, by
  # someone with write access. The job conditions below allow for it.
  workflow_dispatch:

# Cancel any in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_paths:
    uses: ./.github/workflows/check_paths.yml

  spell_check:
    needs: check_paths
    if: needs.check_paths.outputs.githubfolder == 'false' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/spell_check.yml

  reuse:
    needs: check_paths
    if: needs.check_paths.outputs.githubfolder == 'false' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reuse.yml

  ensure_linting:
    needs:
      - check_paths
      - spell_check
      - reuse
    if: needs.check_paths.outputs.githubfolder == 'false' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ensure_linting.yml

  elixir_dep_verification_and_static_analysis:
    needs:
      - check_paths
      - ensure_linting
    if: (needs.check_paths.outputs.githubfolder == 'false' && needs.check_paths.outputs.elixir == 'true') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/elixir_dep_verification_and_static_analysis.yml

  elixir_test:
    needs:
      - check_paths
      - ensure_linting
    if: (needs.check_paths.outputs.githubfolder == 'false' && needs.check_paths.outputs.elixir == 'true') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/elixir_test.yml

  nix_test:
    needs:
      - check_paths
      - ensure_linting
    # The NixOS module test builds the Elixir release, so it runs on the same
    # changes as the Elixir CI.
    if: (needs.check_paths.outputs.githubfolder == 'false' && needs.check_paths.outputs.elixir == 'true') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/nix_test.yml

  rust_static_analysis:
    needs:
      - check_paths
      - ensure_linting
    if: (needs.check_paths.outputs.githubfolder == 'false' && needs.check_paths.outputs.rust == 'true') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/rust_static_analysis.yml

  rust_test:
    needs:
      - check_paths
      - ensure_linting
    if: (needs.check_paths.outputs.githubfolder == 'false' && needs.check_paths.outputs.rust == 'true') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/rust_test.yml

  # The single required status check for this workflow in the ruleset for
  # main, since a ruleset can only require jobs, not whole workflows.
  # `if: always()` is required: without it, this job is skipped when a needed
  # job fails, and a skipped required check counts as passing. Needed jobs
  # skipped by their path conditions pass; failed or cancelled ones fail it.
  # A run held back for .github changes, where no CI ran, fails it on pull
  # requests; on push and workflow_dispatch runs, only a failed or cancelled
  # job fails it.
  devops_result:
    name: DevOps result
    needs:
      - check_paths
      - spell_check
      - reuse
      - ensure_linting
      - elixir_dep_verification_and_static_analysis
      - elixir_test
      - nix_test
      - rust_static_analysis
      - rust_test
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Fail if a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Fail if the run was held back for .github changes
        if: needs.check_paths.outputs.githubfolder == 'true' && github.event_name != 'workflow_dispatch' && github.event_name != 'push'
        run: |
          echo "::error::This run was held back because the change touches .github/. A maintainer verifies it with a workflow_dispatch run on the branch, whose checks do not show on the pull request, and then merges via the ruleset bypass."
          exit 1
