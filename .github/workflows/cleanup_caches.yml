name: Cleanup caches by a branch

on:
  pull_request:
    types:
      - closed
    paths:
      - "**/*"
      - "!.github/**" # Important: Exclude PRs related to .github from auto-run
      - "!.github/workflows/**" # Important: Exclude PRs related to .github/workflows from auto-run
      - "!.github/actions/**" # Important: Exclude PRs related to .github/actions from auto-run

# Only the newest cleanup run per pull request is kept. The group uses the
# pull request number, not github.ref: for a merged pull request github.ref
# is the base branch, so cleanups of different pull requests would cancel
# each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_paths:
    uses: $/.github/workflows/check_paths.yml

  cleanup:
    name: Delete caches when PR is closed
    needs: check_paths
    if: needs.check_paths.outputs.githubfolder == 'false'
    runs-on: ubuntu-24.04
    # Only this job deletes caches, so only it gets `actions: write`.
    permissions:
      contents: read
      actions: write # required to delete caches

    steps:
      - name: Cleanup
        run: |
          echo "Fetching list of cache key"
          cacheKeysForPR=$(gh cache list --repo "$REPO" --ref "$BRANCH" --limit 100 | cut -f 1 )

          ## Setting this to not fail the workflow while deleting cache keys.
          set +e
          echo "Deleting caches..."
          while IFS= read -r cacheKey; do
              [ -n "$cacheKey" ] || continue
              gh cache delete "$cacheKey" --repo "$REPO"
          done <<<"$cacheKeysForPR"
          echo "Done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: refs/pull/${{ github.event.pull_request.number }}/merge
