---
name: Update flake.lock
on:
  workflow_dispatch:
  schedule:
    # runs weekly on Saturday at 00:00 UTC time
    - cron: "0 0 * * 6"

# A newer run on the same ref pushes the same update branch, so it supersedes
# the older one, which is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lockfile:
    name: Update flake.lock
    runs-on: ubuntu-24.04
    permissions:
      contents: write # required to push the update branch
      pull-requests: write # required to open the pull request
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push needs no credential from the checkout: update-flake-lock
          # only commits locally and leaves the push and the pull request to
          # peter-evans/create-pull-request, passing it its `token` input
          # (default github.token). create-pull-request configures its own
          # git authentication from that token (GitConfigHelper.configureToken,
          # called in src/create-pull-request.ts before any fetch or push).
          persist-credentials: false

      - name: Set up Nix and the store cache
        uses: $/.github/actions/setup-nix
        with:
          purpose: flake-lock

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 #v29
        with:
          pr-title: "build(deps): update flake.lock"
          pr-labels: |
            dependencies
            automated

      - name: Print PR number
        env:
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        run: echo "Pull request number is ${PR_NUMBER}."
