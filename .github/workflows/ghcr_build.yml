name: Build GHCR images

on:
  push:
    branches: ["main"]
    paths:
      - "**/*"
      - "!.github/**" # Important: Exclude pushes related to .github from auto-run
      - "!.github/workflows/**" # Important: Exclude pushes related to .github/workflows from auto-run
      - "!.github/actions/**" # Important: Exclude pushes related to .github/actions from auto-run
  pull_request:
    branches: ["main"]
    paths:
      - "**/*"
      - "!.github/**" # Important: Exclude PRs related to .github from auto-run
      - "!.github/workflows/**" # Important: Exclude PRs related to .github/workflows from auto-run
      - "!.github/actions/**" # Important: Exclude PRs related to .github/actions from auto-run
  # Pull requests touching .github are excluded from the automatic runs above,
  # since the workflow definition that would run is the one from the pull
  # request. This is the deliberate way to run the ghcr build for them anyway, by
  # someone with write access. The job conditions below allow for it.
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  check_paths:
    uses: ./.github/workflows/check_paths.yml

  check_if_pr_from_outside_repo:
    needs: check_paths
    if: needs.check_paths.outputs.githubfolder == 'false' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/check_if_pr_from_outside_repo.yml

  teslamate_build:
    name: Build images
    needs:
      - check_paths
      - check_if_pr_from_outside_repo
    if: (needs.check_paths.outputs.githubfolder == 'false' && needs.check_if_pr_from_outside_repo.outputs.is_pr_from_outside_repo == 'false') || (github.event_name == 'workflow_dispatch' && needs.check_if_pr_from_outside_repo.outputs.is_pr_from_outside_repo == 'false')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "linux/amd64"
            runs_on: "ubuntu-24.04"
            cache_id: amd64
          - platform: "linux/arm64"
            runs_on: "ubuntu-24.04-arm"
            cache_id: arm64

    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          # A pull request image is built from the head of the pull request,
          # not from the merge commit GitHub creates by default, whose hash is
          # in no branch. The version then shows a commit of the branch under
          # test. Empty for other events, which keeps the default ref of the
          # event.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Buildx
        uses: ./.github/actions/build
        with:
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ github.head_ref || github.ref_name }}
          revision: ${{ steps.checkout.outputs.commit }}
          labels: |
            org.opencontainers.image.version=${{ github.ref || github.ref_name }}

  teslamate_merge:
    name: Merge GHCR images
    needs:
      - check_paths
      - teslamate_build
    if: needs.check_paths.outputs.githubfolder == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge
        id: merge
        uses: ./.github/actions/merge
        with:
          image: ${{ env.REGISTRY_IMAGE }}

  grafana:
    needs:
      - check_paths
      - check_if_pr_from_outside_repo
    if: (needs.check_paths.outputs.githubfolder == 'false' && needs.check_if_pr_from_outside_repo.outputs.is_pr_from_outside_repo == 'false') || (github.event_name == 'workflow_dispatch' && needs.check_if_pr_from_outside_repo.outputs.is_pr_from_outside_repo == 'false')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/grafana
        with:
          image: ${{ env.REGISTRY_IMAGE }}/grafana
          labels: |
            org.opencontainers.image.version=${{ github.ref || github.ref_name }}

  # The single required status check for this workflow in the ruleset for
  # main, since a ruleset can only require jobs, not whole workflows.
  # `if: always()` is required: without it, this job is skipped when a needed
  # job fails, and a skipped required check counts as passing. Needed jobs
  # skipped by their conditions, such as the builds for pull requests from
  # forks, pass; failed or cancelled ones fail it. A run held back for .github
  # changes, where no build ran, fails it on pull requests; on push and
  # workflow_dispatch runs, only a failed or cancelled job fails it.
  ghcr_build_result:
    name: GHCR build result
    needs:
      - check_paths
      - check_if_pr_from_outside_repo
      - teslamate_build
      - teslamate_merge
      - grafana
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Fail if a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Fail if the run was held back for .github changes
        if: needs.check_paths.outputs.githubfolder == 'true' && github.event_name != 'workflow_dispatch' && github.event_name != 'push'
        run: |
          echo "::error::This run was held back because the change touches .github/. A maintainer verifies it with a workflow_dispatch run on the branch, whose checks do not show on the pull request, and then merges via the ruleset bypass."
          exit 1
