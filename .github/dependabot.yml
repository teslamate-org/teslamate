version: 2
updates:
  # Hex, npm, and Cargo lockfiles stay identical to the upstream release and
  # are updated by upstream, so the fork runs no Dependabot for them.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5 # zizmor: ignore[dependabot-cooldown] Dependabot counts whole days, so 5 keeps the 96-hour minimum package age

  - package-ecosystem: "docker"
    directory: "/grafana"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5 # zizmor: ignore[dependabot-cooldown] Dependabot counts whole days, so 5 keeps the 96-hour minimum package age

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    groups:
      actions-deps:
        patterns:
          - "*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5 # zizmor: ignore[dependabot-cooldown] Dependabot counts whole days, so 5 keeps the 96-hour minimum package age
      # Own actions are exempt from the cooldown.
      exclude:
        - "rewse/*"
