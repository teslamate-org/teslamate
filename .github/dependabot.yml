version: 2
updates:
  - package-ecosystem: "mix"
    directory: "/elixir"
    schedule:
      interval: "monthly"
    # Dependabot counts whole days, so 5 keeps the 4-day Hex cooldown in elixir/mix.exs.
    cooldown:
      default-days: 5 # zizmor: ignore[dependabot-cooldown] Dependabot counts whole days, so 5 keeps the 96-hour minimum package age

  - package-ecosystem: "npm"
    directory: "/elixir/assets"
    schedule:
      interval: "monthly"
    # Dependabot counts whole days, so 5 keeps the 4-day npm cooldown in elixir/assets/.npmrc.
    cooldown:
      default-days: 5 # zizmor: ignore[dependabot-cooldown] Dependabot counts whole days, so 5 keeps the 96-hour minimum package age
    ignore:
      # ignore the path based dependencies to prevent "Dependabot couldn't fetch all your path-based dependencies"
      - dependency-name: phoenix
      - dependency-name: phoenix_html
      - dependency-name: phoenix_live_view

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "monthly"
    # Dependabot counts whole days, so 5 keeps the 4-day npm cooldown in website/.npmrc.
    cooldown:
      default-days: 5 # zizmor: ignore[dependabot-cooldown] Dependabot counts whole days, so 5 keeps the 96-hour minimum package age

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5 # zizmor: ignore[dependabot-cooldown] Dependabot counts whole days, so 5 keeps the 96-hour minimum package age

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5 # zizmor: ignore[dependabot-cooldown] Dependabot counts whole days, so 5 keeps the 96-hour minimum package age

  - package-ecosystem: "docker"
    directory: "/grafana"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5 # zizmor: ignore[dependabot-cooldown] Dependabot counts whole days, so 5 keeps the 96-hour minimum package age

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    groups:
      actions-deps:
        patterns:
          - "*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5 # zizmor: ignore[dependabot-cooldown] Dependabot counts whole days, so 5 keeps the 96-hour minimum package age
      # Own actions are exempt from the cooldown.
      exclude:
        - "rewse/*"
