name: "Grafana"
description: "Grafana images"
inputs:
  tags:
    description: "Tags"
    required: false
    default: ""
  labels:
    description: "Labels"
    required: true
  image:
    description: "Image target"
    required: true
    default: "teslamate/grafana"
runs:
  using: "composite"
  steps:
    - name: Docker meta
      id: docker_meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.image }}
        tags: ${{ inputs.tags }}
        # metadata-action would take org.opencontainers.image.licenses from
        # GitHub's license detection (AGPL-3.0); NOTICE grants AGPL-3.0-or-later.
        labels: |
          org.opencontainers.image.licenses=AGPL-3.0-or-later
          ${{ inputs.labels }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build and push
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        # grafana/Dockerfile.dockerignore limits the context to what the image needs.
        context: .
        file: grafana/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        # See build action for why BuildKit-side attestations are disabled:
        # we want outputs.digest to be the multi-arch manifest list digest so
        # that signed attestations land where `gh attestation verify` looks.
        provenance: false
        sbom: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Attest grafana provenance
      # grafana is a single multi-arch build, so steps.build.outputs.digest is
      # the manifest-list digest that `gh attestation verify oci://...:tag`
      # resolves to. Skip on unreviewed builds: see build action for the
      # rationale.
      if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        # See build action: qualify Docker Hub short names with docker.io.
        subject-name: >-
          ${{ startsWith(inputs.image, 'ghcr.io/')
              && inputs.image
              || format('docker.io/{0}', inputs.image) }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
