name: "Grafana"
description: "Grafana images"
inputs:
  tags:
    description: "Tags"
    required: false
    default: ""
  labels:
    description: "Labels"
    required: true
  image:
    description: "Image target"
    required: true
    default: "teslamate/grafana"
runs:
  using: "composite"
  steps:
    - name: Docker meta
      id: docker_meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.image }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: Build and push
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: grafana
        push: true
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        tags: ${{ steps.docker_meta.outputs.tags }}
        # See build action for why BuildKit-side attestations are disabled:
        # we want outputs.digest to be the multi-arch manifest list digest so
        # that signed attestations land where `gh attestation verify` looks.
        provenance: false
        sbom: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Attest grafana provenance
      # grafana is a single multi-arch build, so steps.build.outputs.digest is
      # the manifest-list digest that `gh attestation verify oci://...:tag`
      # resolves to. Skip on unreviewed builds: see build action for the
      # rationale.
      if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        # See build action: qualify Docker Hub short names with docker.io.
        subject-name: >-
          ${{ startsWith(inputs.image, 'ghcr.io/')
              && inputs.image
              || format('docker.io/{0}', inputs.image) }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
