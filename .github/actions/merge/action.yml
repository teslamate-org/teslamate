name: "Merge"
description: "Merge images"
inputs:
  tags:
    description: "Tags"
    required: false
    default: ""
  image:
    description: "Image target"
    required: true

runs:
  using: "composite"
  steps:
    - name: Merge digests and reupload
      uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: digests
        pattern: single-digest-*

    - name: Download merged digests
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: digests
        path: /tmp/digests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.image }}
        tags: ${{ inputs.tags }}

    - name: Create manifest list and push
      working-directory: /tmp/digests
      shell: bash
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
    - name: Capture manifest digest
      id: manifest
      shell: bash
      env:
        TAG: ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
      run: |
        DIGEST="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        echo "manifest list digest: ${DIGEST}"
    - name: Attest manifest provenance
      # Skip on unreviewed builds: see build action for the rationale.
      if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        # See build action: qualify Docker Hub short names with docker.io.
        subject-name: >-
          ${{ startsWith(env.REGISTRY_IMAGE, 'ghcr.io/')
              && env.REGISTRY_IMAGE
              || format('docker.io/{0}', env.REGISTRY_IMAGE) }}
        subject-digest: ${{ steps.manifest.outputs.digest }}
        push-to-registry: true
    - name: Inspect image
      shell: bash
      run: |
        docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
