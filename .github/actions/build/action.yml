name: "Build"
description: "Build images"
inputs:
  is_dockerhub_pushed:
    description: "Need docker hub login?"
    required: true
    default: ""
  docker_password:
    description: "Docker password"
    required: true
  repository_owner:
    description: "Repository owner"
    required: true
    default: "teslamate-org"
  repository:
    description: "Repo owner and name (repo_owner/repo_name)"
    required: true
    default: "teslamate"
  github_token:
    description: "GitHub Token"
    required: true
  labels:
    description: "Labels added on metadata"
    required: false
    default: ""
  version:
    description: "Branch deployed"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: normalize version name to a valid string
      # convert backslashes to dashes, so for example dependabot/x/y/z-1.2.3 works
      id: normalize_version
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        NORMALIZED_VERSION="${VERSION//\//-}"
        echo "normalized_version=${NORMALIZED_VERSION}" >> $GITHUB_OUTPUT

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY_IMAGE }}
        labels: |
          {{ inputs.labels }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: Login to Docker Hub
      if: inputs.is_dockerhub_pushed != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: teslamate
        password: ${{ inputs.docker_password }}
    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ inputs.repository_owner }}
        password: ${{ inputs.github_token }}
    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        tags: ${{ steps.docker_meta.outputs.tags }}
        # Disable BuildKit-side attestations so outputs.digest is the bare image
        # manifest digest. With provenance enabled, BuildKit wraps the image in
        # an OCI index whose digest does NOT appear in the multi-arch manifest
        # list produced by `imagetools create`, which would make tag-based
        # attestation verification fail. Signed SLSA provenance is added by
        # actions/attest-build-provenance below.
        provenance: false
        sbom: false
        cache-from: |
          type=registry,ref=ghcr.io/${{ inputs.repository }}:buildcache-${{ matrix.cache_id }}-${{ steps.normalize_version.outputs.normalized_version }}
          type=registry,ref=ghcr.io/${{ inputs.repository }}:buildcache-${{ matrix.cache_id }}-main
        cache-to: type=registry,ref=ghcr.io/${{ inputs.repository }}:buildcache-${{ matrix.cache_id }}-${{ steps.normalize_version.outputs.normalized_version }},mode=max
        outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
    - name: Generate SBOM for pushed image
      # Skip on pull_request and workflow_dispatch: both build unreviewed
      # code. Attesting them would yield signed attestations that pass
      # `gh attestation verify --repo teslamate-org/teslamate`, which
      # consumers read as "official".
      if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
      uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      with:
        image: ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }}
        format: spdx-json
        output-file: /tmp/sbom-${{ matrix.cache_id }}.spdx.json
        upload-artifact: false
        upload-release-assets: false
    - name: Attest build provenance
      if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        # attest-* reads the registry from the first path segment of subject-name,
        # so qualify Docker Hub short names with docker.io; leave ghcr.io as-is.
        subject-name: >-
          ${{ startsWith(env.REGISTRY_IMAGE, 'ghcr.io/')
              && env.REGISTRY_IMAGE
              || format('docker.io/{0}', env.REGISTRY_IMAGE) }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
    - name: Attest SBOM
      if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: >-
          ${{ startsWith(env.REGISTRY_IMAGE, 'ghcr.io/')
              && env.REGISTRY_IMAGE
              || format('docker.io/{0}', env.REGISTRY_IMAGE) }}
        subject-digest: ${{ steps.build.outputs.digest }}
        predicate-type: "https://spdx.dev/Document"
        predicate-path: /tmp/sbom-${{ matrix.cache_id }}.spdx.json
        push-to-registry: true
    - name: Export digest
      shell: bash
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"
        ls -l /tmp/digests/
    - name: Upload digest
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: single-digest-${{ matrix.cache_id }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1
