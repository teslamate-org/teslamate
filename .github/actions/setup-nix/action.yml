name: "Setup Nix"
description: "Install Nix and restore/save the Nix store cache"
inputs:
  purpose:
    # Each job caches a different Nix closure (lint: treefmt + Elixir; rust:
    # rustc, cargo, clippy; reuse: reuse). One shared key would make the jobs overwrite
    # each other's cache on every save and purge each other's versions, so
    # every job restores a closure the other job built and then rebuilds its
    # own. The purpose namespaces the primary key, the restore prefix and the
    # purge prefix, so each job only ever sees its own cache.
    description: "Cache namespace, part of every cache key (e.g. lint, rust)"
    required: true
runs:
  using: "composite"
  steps:
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

    - name: Nix binary cache
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        # restore and save a cache using this key
        primary-key: nix-${{ runner.os }}-${{ inputs.purpose }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'elixir/mix.lock', 'rust/Cargo.lock') }}
        # if there's no cache hit, restore a cache by this prefix
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ inputs.purpose }}-
        # collect garbage until Nix store size (in bytes) is at most this number
        # before trying to save a new cache. Sized for the largest consumer:
        # after a substituted build of .#teslamate-rust-clippy the store holds
        # the build inputs' closures (rustc, cargo, clippy, stdenv, vendored
        # deps), measured at 2.8 GB with `nix path-info -s` over their
        # requisites; the .#lint closure is 2.6 GB. 4G leaves room for both to
        # grow without the whole closure being GC'd away every run.
        gc-max-store-size-linux: 4294967296
        # do purge caches
        purge: true
        # purge all versions of the cache
        purge-prefixes: nix-${{ runner.os }}-${{ inputs.purpose }}-
        # created more than this number of seconds ago
        # relative to the start of the `Post Restore and save Nix store` phase
        purge-created: 0
        # except any version with the key that is the same as the `primary-key`
        purge-primary-key: never
